[project]
name = "quantum-party-annealing"
version = "0.1.0"
description = "Microservicio de quantum annealing (OpenJij) para la Categoría 4 de Quantum Party."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "openjij>=0.9",
    "pyqubo>=1.5",
    "pydantic>=2.10",
    "numpy>=1.26",
    "pyjwt[crypto]>=2.10",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.8", "httpx>=0.28"]

[tool.ruff]
line-length = 100
target-version = "py312"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
