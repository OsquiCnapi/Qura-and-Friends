project_id = "quantum-party"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[realtime]
enabled = true

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:3000"
# Auth anónima por dispositivo (jóvenes sin cuenta). Los 2 jugadores hotseat comparten una cuenta.
enable_anonymous_sign_ins = true

[edge_runtime]
enabled = true

[functions.submit-score]
verify_jwt = true

[functions.anneal]
verify_jwt = true
