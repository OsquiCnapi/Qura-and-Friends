project_id = "quantum-party"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[realtime]
enabled = true

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:3000"
# Auth anónima por dispositivo (jóvenes sin cuenta). Los 2 jugadores hotseat comparten una cuenta.
enable_anonymous_sign_ins = true

[edge_runtime]
enabled = true

[functions.submit-score]
verify_jwt = true
# Sin esto, `supabase functions deploy` no sube functions/deno.json como asset y el bundler remoto
# rompe con "Relative import path @supabase/supabase-js not prefixed with / or ./ or ../" (el import
# map que resuelve ese specifier vive ahí). Ver también deno.json en este mismo directorio.
import_map = "./functions/deno.json"

[functions.anneal]
verify_jwt = true
import_map = "./functions/deno.json"
